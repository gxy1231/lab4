<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Lab4 XML & JSON</title>
<style>
    table {
        border-collapse: collapse;
        margin: 10px 0 30px 0;
    }
    table, th, td {
        border: 1px solid #333;
    }
    th, td {
        padding: 6px 12px;
    }
</style>
</head>
<body>
<h2>图书目录（来自 book.xml）</h2>
<table id="bookTable">
    <tr><th>编号</th><th>书名</th><th>作者</th><th>价格</th></tr>
</table>

<h2>用户信息（来自 userProfiles.json）</h2>
<table id="userTable">
    <tr><th>姓名</th><th>邮箱</th><th>生日</th><th>地址</th><th>订阅</th></tr>
</table>

<script>
// 读取 book.xml
var xhr = new XMLHttpRequest();
xhr.open("GET", "book.xml", true);
xhr.onreadystatechange = function () {
    if (xhr.readyState == 4 && xhr.status == 200) {
        var xmlDoc = xhr.responseXML;
        var books = xmlDoc.getElementsByTagName("book");
        var str = "";
        for (var i = 0; i < books.length; i++) {
            var id = books[i].getAttribute("id");
            var title = books[i].getElementsByTagName("title")[0].childNodes[0].nodeValue;
            var author = books[i].getElementsByTagName("author")[0].childNodes[0].nodeValue;
            var price = books[i].getElementsByTagName("price")[0].childNodes[0].nodeValue;
            str += "<tr><td>" + id + "</td><td>" + title + "</td><td>" + author + "</td><td>" + price + "</td></tr>";
        }
        document.getElementById("bookTable").innerHTML += str;
    }
};
xhr.send();

// 读取 userProfiles.json
fetch("userProfiles.json")
    .then(function (res) {
        return res.json();
    })
    .then(function (data) {
        var str = "";
        for (var i = 0; i < data.length; i++) {
            var user = data[i];
            var address = user.address.street + "，" + user.address.city + "，" + user.address.state + "，" + user.address.zipCode;
            str += "<tr><td>" + user.firstName + " " + user.lastName + "</td><td>" + user.email + "</td><td>" + user.dateOfBirth + "</td><td>" + address + "</td><td>" + user.preferences.subscription + "</td></tr>";
        }
        document.getElementById("userTable").innerHTML += str;
    });
</script>
</body>
</html>
