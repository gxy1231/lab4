<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>XML Lab - Book Catalogue</title>
<style>
    table {
        border-collapse: collapse;
        margin: 10px 0 30px 0;
    }
    table, th, td {
        border: 1px solid #333;
    }
    th, td {
        padding: 6px 12px;
    }
</style>
</head>
<body>
<p><a href="index.html">返回首页</a></p>
<h2>图书目录（来自 book.xml）</h2>
<table id="bookTable">
    <tr><th>编号</th><th>书名</th><th>作者</th><th>价格</th></tr>
</table>

<script>
// 读取 book.xml
fetch("book.xml")
    .then(function (res) {
        return res.text();
    })
    .then(function (xmlText) {
        var parser = new DOMParser();
        var xmlDoc = parser.parseFromString(xmlText, "text/xml");
        var books = xmlDoc.getElementsByTagName("book");
        var str = "";
        for (var i = 0; i < books.length; i++) {
            var id = books[i].getAttribute("id");
            var title = books[i].getElementsByTagName("title")[0].childNodes[0].nodeValue;
            var author = books[i].getElementsByTagName("author")[0].childNodes[0].nodeValue;
            var price = books[i].getElementsByTagName("price")[0].childNodes[0].nodeValue;
            str += "<tr><td>" + id + "</td><td>" + title + "</td><td>" + author + "</td><td>" + price + "</td></tr>";
        }
        document.getElementById("bookTable").innerHTML += str;
    })
    .catch(function (err) {
        console.error("Fetch error: " + err.message);
    });
</script>
</body>
</html>
